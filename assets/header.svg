<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 364" width="1200" height="364" role="img" aria-labelledby="t d">
<title id="t">Hamza Baaqil: Product, UX/UI, Usability</title><desc id="d">The name Hamza Baaqil beside a loop of six steps: research, sprint, prototype, test, audit, fix.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1630"/><stop offset="1" stop-color="#0A0F1E"/></linearGradient>
<linearGradient id="bt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6CB6FF"/><stop offset="1" stop-color="#56D4C5"/></linearGradient>
<radialGradient id="gb"><stop offset="0" stop-color="#6CB6FF" stop-opacity=".22"/><stop offset="1" stop-color="#6CB6FF" stop-opacity="0"/></radialGradient>
<radialGradient id="gt"><stop offset="0" stop-color="#56D4C5" stop-opacity=".16"/><stop offset="1" stop-color="#56D4C5" stop-opacity="0"/></radialGradient>
<radialGradient id="ga"><stop offset="0" stop-color="#F6B24A" stop-opacity=".14"/><stop offset="1" stop-color="#F6B24A" stop-opacity="0"/></radialGradient>
<radialGradient id="gv"><stop offset="0" stop-color="#B9A1FF" stop-opacity=".16"/><stop offset="1" stop-color="#B9A1FF" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2E3F70" opacity=".6"/></pattern>
<clipPath id="clip"><rect width="1200" height="364" rx="18"/></clipPath>
</defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.flow{stroke-dasharray:3 9;animation:flow 2.6s linear infinite}
.flow2{stroke-dasharray:2 7;animation:flow 3.4s linear infinite reverse}
@keyframes flow{to{stroke-dashoffset:-24}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.pulse.b{animation-delay:.8s}.pulse.c{animation-delay:1.6s}.pulse.d{animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(var(--d,300px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)"><rect width="1200" height="364" fill="url(#bg)"/><rect width="1200" height="364" fill="url(#dots)"/><circle cx="250" cy="182" r="260" fill="url(#gb)"/><circle cx="980" cy="330" r="300" fill="url(#gt)"/><circle cx="1130" cy="20" r="200" fill="url(#gv)"/>
<circle cx="250" cy="182" r="104" fill="none" stroke="#2C3F6E" stroke-width="1.5"/>
<circle class="flow" cx="250" cy="182" r="104" fill="none" stroke="#6CB6FF" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="250" cy="182" r="70" fill="none" stroke="#22315A" stroke-dasharray="1 6"/>
<circle cx="250.0" cy="78.0" r="13" fill="#6CB6FF" fill-opacity=".14"/><circle class="pulse " cx="250.0" cy="78.0" r="6.5" fill="#6CB6FF"/>
<text class="m" x="250.0" y="50.0" font-size="14" font-weight="700" letter-spacing="1.5" fill="#6CB6FF" text-anchor="middle">RESEARCH</text>
<circle cx="340.1" cy="130.0" r="13" fill="#56D4C5" fill-opacity=".14"/><circle class="pulse b" cx="340.1" cy="130.0" r="6.5" fill="#56D4C5"/>
<text class="m" x="362.6" y="121.0" font-size="14" font-weight="700" letter-spacing="1.5" fill="#56D4C5" text-anchor="start">SPRINT</text>
<circle cx="340.1" cy="234.0" r="13" fill="#B9A1FF" fill-opacity=".14"/><circle class="pulse c" cx="340.1" cy="234.0" r="6.5" fill="#B9A1FF"/>
<text class="m" x="362.6" y="251.0" font-size="14" font-weight="700" letter-spacing="1.5" fill="#B9A1FF" text-anchor="start">PROTOTYPE</text>
<circle cx="250.0" cy="286.0" r="13" fill="#F6B24A" fill-opacity=".14"/><circle class="pulse d" cx="250.0" cy="286.0" r="6.5" fill="#F6B24A"/>
<text class="m" x="250.0" y="324.0" font-size="14" font-weight="700" letter-spacing="1.5" fill="#F6B24A" text-anchor="middle">TEST</text>
<circle cx="159.9" cy="234.0" r="13" fill="#FF8090" fill-opacity=".14"/><circle class="pulse " cx="159.9" cy="234.0" r="6.5" fill="#FF8090"/>
<text class="m" x="137.4" y="251.0" font-size="14" font-weight="700" letter-spacing="1.5" fill="#FF8090" text-anchor="end">AUDIT</text>
<circle cx="159.9" cy="130.0" r="13" fill="#4ADE9A" fill-opacity=".14"/><circle class="pulse b" cx="159.9" cy="130.0" r="6.5" fill="#4ADE9A"/>
<text class="m" x="137.4" y="121.0" font-size="14" font-weight="700" letter-spacing="1.5" fill="#4ADE9A" text-anchor="end">FIX</text>
<g style="transform-origin:250px 182px;animation:spin 14s linear infinite"><circle cx="250" cy="78" r="4.5" fill="#fff"/><circle cx="250" cy="78" r="11" fill="#fff" fill-opacity=".18"/></g>
<text class="m" x="250" y="170" font-size="12.5" letter-spacing="2" fill="#8D9CB8" text-anchor="middle">FIND</text>
<text class="m" x="250" y="187" font-size="12.5" letter-spacing="2" fill="#8D9CB8" text-anchor="middle">FIX</text>
<text class="m" x="250" y="204" font-size="12.5" letter-spacing="2" fill="#B7C3D9" text-anchor="middle">RE-TEST</text>
<line x1="478" y1="70" x2="478" y2="292" stroke="#24335C"/>
<text class="s" x="520" y="150" font-size="60" font-weight="800" letter-spacing="-1" fill="url(#bt)">Hamza Baaqil</text>
<text class="m" x="520" y="196" font-size="20" fill="#E8EEF9"><tspan fill="#56D4C5">&gt;</tspan> Product <tspan fill="#8D9CB8">·</tspan> UX/UI <tspan fill="#8D9CB8">·</tspan> Usability <tspan class="blink" fill="#56D4C5">▍</tspan></text>
<text class="s" x="520" y="236" font-size="17" font-style="italic" fill="#B7C3D9">I run usability tests, design sprints and accessibility audits,</text>
<text class="s" x="520" y="260" font-size="17" font-style="italic" fill="#B7C3D9">then re-test the fixes.</text>
<rect x="520.0" y="284.0" width="71" height="30" rx="15" fill="#6CB6FF" fill-opacity=".09" stroke="#6CB6FF" stroke-opacity=".85"/><text class="m" x="555.5" y="304.0" font-size="14" font-weight="700" fill="#6CB6FF" text-anchor="middle">KFUPM</text>
<rect x="601.0" y="284.0" width="71" height="30" rx="15" fill="#56D4C5" fill-opacity=".09" stroke="#56D4C5" stroke-opacity=".85"/><text class="m" x="636.5" y="304.0" font-size="14" font-weight="700" fill="#56D4C5" text-anchor="middle">SABIC</text>
<rect x="682.0" y="284.0" width="122" height="30" rx="15" fill="#F6B24A" fill-opacity=".09" stroke="#F6B24A" stroke-opacity=".85"/><text class="m" x="743.0" y="304.0" font-size="14" font-weight="700" fill="#F6B24A" text-anchor="middle">Olo Academy</text>
<rect x="814.0" y="284.0" width="139" height="30" rx="15" fill="#B9A1FF" fill-opacity=".09" stroke="#B9A1FF" stroke-opacity=".85"/><text class="m" x="883.5" y="304.0" font-size="14" font-weight="700" fill="#B9A1FF" text-anchor="middle">GDG on Campus</text>
</g>
<rect x=".5" y=".5" width="1199" height="363" rx="18" fill="none" stroke="#24335C"/>
</svg>
