<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 996 96" width="996" height="96" role="img" aria-labelledby="t d">
<title id="t">Where I studied, trained and worked</title><desc id="d">KFUPM, SABIC, Olo Academy and GDG on Campus.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1630"/><stop offset="1" stop-color="#0A0F1E"/></linearGradient>
<linearGradient id="bt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6CB6FF"/><stop offset="1" stop-color="#56D4C5"/></linearGradient>
<radialGradient id="gb"><stop offset="0" stop-color="#6CB6FF" stop-opacity=".22"/><stop offset="1" stop-color="#6CB6FF" stop-opacity="0"/></radialGradient>
<radialGradient id="gt"><stop offset="0" stop-color="#56D4C5" stop-opacity=".16"/><stop offset="1" stop-color="#56D4C5" stop-opacity="0"/></radialGradient>
<radialGradient id="ga"><stop offset="0" stop-color="#F6B24A" stop-opacity=".14"/><stop offset="1" stop-color="#F6B24A" stop-opacity="0"/></radialGradient>
<radialGradient id="gv"><stop offset="0" stop-color="#B9A1FF" stop-opacity=".16"/><stop offset="1" stop-color="#B9A1FF" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2E3F70" opacity=".6"/></pattern>
<clipPath id="clip"><rect width="996" height="96" rx="18"/></clipPath>
</defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.flow{stroke-dasharray:3 9;animation:flow 2.6s linear infinite}
.flow2{stroke-dasharray:2 7;animation:flow 3.4s linear infinite reverse}
@keyframes flow{to{stroke-dashoffset:-24}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.pulse.b{animation-delay:.8s}.pulse.c{animation-delay:1.6s}.pulse.d{animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(var(--d,300px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)"><rect width="996" height="96" fill="url(#bg)"/><rect width="996" height="96" fill="url(#dots)"/>
<rect x="20" y="16" width="228" height="64" rx="12" fill="#101A36" stroke="#6CB6FF" stroke-opacity=".7"/><rect x="34" y="28" width="4" height="40" rx="2" fill="#6CB6FF"/>
<text class="s" x="50" y="44" font-size="17" font-weight="800" fill="#E8EEF9">KFUPM</text><text class="m" x="50" y="64" font-size="12" fill="#B7C3D9">BSc Software Engineering</text>
<rect x="264" y="16" width="228" height="64" rx="12" fill="#101A36" stroke="#56D4C5" stroke-opacity=".7"/><rect x="278" y="28" width="4" height="40" rx="2" fill="#56D4C5"/>
<text class="s" x="294" y="44" font-size="17" font-weight="800" fill="#E8EEF9">SABIC</text><text class="m" x="294" y="64" font-size="12" fill="#B7C3D9">Data Science Intern</text>
<rect x="508" y="16" width="228" height="64" rx="12" fill="#101A36" stroke="#F6B24A" stroke-opacity=".7"/><rect x="522" y="28" width="4" height="40" rx="2" fill="#F6B24A"/>
<text class="s" x="538" y="44" font-size="17" font-weight="800" fill="#E8EEF9">Olo Academy</text><text class="m" x="538" y="64" font-size="12" fill="#B7C3D9">Product Management, 52h</text>
<rect x="752" y="16" width="228" height="64" rx="12" fill="#101A36" stroke="#B9A1FF" stroke-opacity=".7"/><rect x="766" y="28" width="4" height="40" rx="2" fill="#B9A1FF"/>
<text class="s" x="782" y="44" font-size="17" font-weight="800" fill="#E8EEF9">GDG on Campus</text><text class="m" x="782" y="64" font-size="12" fill="#B7C3D9">Journey to AI World</text>
</g>
<rect x=".5" y=".5" width="995" height="95" rx="18" fill="none" stroke="#24335C"/>
