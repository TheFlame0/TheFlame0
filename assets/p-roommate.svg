<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-labelledby="t d">
<title id="t">Roommate matching design sprint</title><desc id="d">A map with pins and one selected place. Four of five test participants found a roommate faster on the map than in a list.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1630"/><stop offset="1" stop-color="#0A0F1E"/></linearGradient>
<linearGradient id="bt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6CB6FF"/><stop offset="1" stop-color="#56D4C5"/></linearGradient>
<radialGradient id="gb"><stop offset="0" stop-color="#6CB6FF" stop-opacity=".22"/><stop offset="1" stop-color="#6CB6FF" stop-opacity="0"/></radialGradient>
<radialGradient id="gt"><stop offset="0" stop-color="#56D4C5" stop-opacity=".16"/><stop offset="1" stop-color="#56D4C5" stop-opacity="0"/></radialGradient>
<radialGradient id="ga"><stop offset="0" stop-color="#F6B24A" stop-opacity=".14"/><stop offset="1" stop-color="#F6B24A" stop-opacity="0"/></radialGradient>
<radialGradient id="gv"><stop offset="0" stop-color="#B9A1FF" stop-opacity=".16"/><stop offset="1" stop-color="#B9A1FF" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2E3F70" opacity=".6"/></pattern>
<clipPath id="clip"><rect width="520" height="340" rx="18"/></clipPath>
</defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.flow{stroke-dasharray:3 9;animation:flow 2.6s linear infinite}
.flow2{stroke-dasharray:2 7;animation:flow 3.4s linear infinite reverse}
@keyframes flow{to{stroke-dashoffset:-24}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.pulse.b{animation-delay:.8s}.pulse.c{animation-delay:1.6s}.pulse.d{animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(var(--d,300px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)"><rect width="520" height="340" fill="url(#bg)"/><rect width="520" height="340" fill="url(#dots)"/><circle cx="420" cy="110" r="190" fill="url(#gt)"/>
<rect x="34" y="34" width="282" height="212" rx="12" fill="#101A36" stroke="#2C3F6E"/>
<path d="M34 96 H316" stroke="#24335C" stroke-width="6" fill="none"/>
<path d="M34 170 H316" stroke="#24335C" stroke-width="6" fill="none"/>
<path d="M112 34 V246" stroke="#24335C" stroke-width="6" fill="none"/>
<path d="M214 34 V246" stroke="#24335C" stroke-width="6" fill="none"/>
<path d="M34 228 L170 34" stroke="#24335C" stroke-width="6" fill="none"/>
<path d="M150 246 L316 120" stroke="#24335C" stroke-width="6" fill="none"/>
<g class="pulse "><path d="M78 86 c-8-10-12-15-12-21 a12 12 0 0 1 24 0 c0 6-4 11-12 21z" fill="#6CB6FF"/><circle cx="78" cy="65" r="4" fill="#0A0F1E"/></g>
<g class="pulse b"><path d="M158 148 c-8-10-12-15-12-21 a12 12 0 0 1 24 0 c0 6-4 11-12 21z" fill="#56D4C5"/><circle cx="158" cy="127" r="4" fill="#0A0F1E"/></g>
<g class="pulse c"><path d="M252 98 c-8-10-12-15-12-21 a12 12 0 0 1 24 0 c0 6-4 11-12 21z" fill="#6CB6FF"/><circle cx="252" cy="77" r="4" fill="#0A0F1E"/></g>
<g class="pulse d"><path d="M92 212 c-8-10-12-15-12-21 a12 12 0 0 1 24 0 c0 6-4 11-12 21z" fill="#6CB6FF"/><circle cx="92" cy="191" r="4" fill="#0A0F1E"/></g>
<g class="pulse "><path d="M262 222 c-8-10-12-15-12-21 a12 12 0 0 1 24 0 c0 6-4 11-12 21z" fill="#6CB6FF"/><circle cx="262" cy="201" r="4" fill="#0A0F1E"/></g>
<g class="pulse b"><path d="M190 76 c-8-10-12-15-12-21 a12 12 0 0 1 24 0 c0 6-4 11-12 21z" fill="#6CB6FF"/><circle cx="190" cy="55" r="4" fill="#0A0F1E"/></g>
<rect x="176" y="126" width="118" height="54" rx="9" fill="#F4F6FA"/><rect x="186" y="136" width="62" height="6" rx="3" fill="#1E2A38"/><rect x="186" y="149" width="44" height="5" rx="2.5" fill="#8D9CB8"/><rect x="186" y="162" width="34" height="10" rx="5" fill="#56D4C5"/>
<text class="s" x="412" y="110" font-size="46" font-weight="800" fill="url(#bt)" text-anchor="middle">4 of 5</text>
<circle cx="364" cy="142" r="8" fill="#56D4C5" />
<circle cx="388" cy="142" r="8" fill="#56D4C5" />
<circle cx="412" cy="142" r="8" fill="#56D4C5" />
<circle cx="436" cy="142" r="8" fill="#56D4C5" />
<circle cx="460" cy="142" r="8" fill="none" stroke="#8D9CB8" stroke-width="1.5"/>
<text class="m" x="412" y="184" font-size="13.5" fill="#B7C3D9" text-anchor="middle">found a roommate</text>
<text class="m" x="412" y="203" font-size="13.5" fill="#B7C3D9" text-anchor="middle">faster on the map</text>
<text class="m" x="412" y="222" font-size="13.5" fill="#B7C3D9" text-anchor="middle">than in a list</text>
<text class="m" x="260" y="286" font-size="13.5" font-weight="700" fill="#E8EEF9" text-anchor="middle">I proposed the map search · team result, 5 participants</text>
<text class="m" x="260" y="318" font-size="13" fill="#56D4C5" text-anchor="middle">interviews → sketches → Figma prototype → 5 test sessions</text>
</g>
<rect x=".5" y=".5" width="519" height="339" rx="18" fill="none" stroke="#24335C"/>
</svg>
