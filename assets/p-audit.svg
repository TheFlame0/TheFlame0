<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" role="img" aria-labelledby="t d">
<title id="t">Rukn accessibility audit</title><desc id="d">An orange button with white text that measured 2.02 to 1, and a tracker of 8 issues: 5 fixed, 1 open, 2 for later.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1630"/><stop offset="1" stop-color="#0A0F1E"/></linearGradient>
<linearGradient id="bt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6CB6FF"/><stop offset="1" stop-color="#56D4C5"/></linearGradient>
<radialGradient id="gb"><stop offset="0" stop-color="#6CB6FF" stop-opacity=".22"/><stop offset="1" stop-color="#6CB6FF" stop-opacity="0"/></radialGradient>
<radialGradient id="gt"><stop offset="0" stop-color="#56D4C5" stop-opacity=".16"/><stop offset="1" stop-color="#56D4C5" stop-opacity="0"/></radialGradient>
<radialGradient id="ga"><stop offset="0" stop-color="#F6B24A" stop-opacity=".14"/><stop offset="1" stop-color="#F6B24A" stop-opacity="0"/></radialGradient>
<radialGradient id="gv"><stop offset="0" stop-color="#B9A1FF" stop-opacity=".16"/><stop offset="1" stop-color="#B9A1FF" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2E3F70" opacity=".6"/></pattern>
<clipPath id="clip"><rect width="520" height="340" rx="18"/></clipPath>
</defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.flow{stroke-dasharray:3 9;animation:flow 2.6s linear infinite}
.flow2{stroke-dasharray:2 7;animation:flow 3.4s linear infinite reverse}
@keyframes flow{to{stroke-dashoffset:-24}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.pulse.b{animation-delay:.8s}.pulse.c{animation-delay:1.6s}.pulse.d{animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(var(--d,300px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#clip)"><rect width="520" height="340" fill="url(#bg)"/><rect width="520" height="340" fill="url(#dots)"/><circle cx="400" cy="60" r="200" fill="url(#ga)"/>
<rect x="34" y="34" width="250" height="96" rx="12" fill="#F4F6FA"/>
<rect x="62" y="60" width="194" height="44" rx="9" fill="#F5A623"/>
<text class="s" x="159" y="88" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Get Started Free</text>
<text class="s" x="306" y="82" font-size="44" font-weight="800" fill="#FF8090">2.02:1</text>
<text class="m" x="308" y="108" font-size="13.5" fill="#B7C3D9">measured contrast</text>
<text class="m" x="308" y="128" font-size="13.5" fill="#8D9CB8">minimum is 4.5:1</text>
<line x1="34" y1="158" x2="486" y2="158" stroke="#24335C"/>
<text class="m" x="34" y="184" font-size="12.5" letter-spacing="1.5" fill="#8D9CB8">AUDIT TRACKER · 8 ISSUES</text>
<circle cx="50" cy="222" r="17" fill="#4ADE9A" fill-opacity=".16" stroke="#4ADE9A" stroke-width="1.5"/><path d="M42 222 l6 6 l10 -12" fill="none" stroke="#4ADE9A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="104" cy="222" r="17" fill="#4ADE9A" fill-opacity=".16" stroke="#4ADE9A" stroke-width="1.5"/><path d="M96 222 l6 6 l10 -12" fill="none" stroke="#4ADE9A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="158" cy="222" r="17" fill="#4ADE9A" fill-opacity=".16" stroke="#4ADE9A" stroke-width="1.5"/><path d="M150 222 l6 6 l10 -12" fill="none" stroke="#4ADE9A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="212" cy="222" r="17" fill="#4ADE9A" fill-opacity=".16" stroke="#4ADE9A" stroke-width="1.5"/><path d="M204 222 l6 6 l10 -12" fill="none" stroke="#4ADE9A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="266" cy="222" r="17" fill="#4ADE9A" fill-opacity=".16" stroke="#4ADE9A" stroke-width="1.5"/><path d="M258 222 l6 6 l10 -12" fill="none" stroke="#4ADE9A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="pulse" cx="320" cy="222" r="17" fill="#FF8090" fill-opacity=".12" stroke="#FF8090" stroke-width="2"/><circle cx="320" cy="222" r="4" fill="#FF8090"/>
<circle cx="374" cy="222" r="17" fill="none" stroke="#8D9CB8" stroke-width="1.5" stroke-dasharray="3 5"/>
<circle cx="428" cy="222" r="17" fill="none" stroke="#8D9CB8" stroke-width="1.5" stroke-dasharray="3 5"/>
<text class="m" x="158" y="268" font-size="13.5" font-weight="700" fill="#4ADE9A" text-anchor="middle">5 fixed at the re-test</text>
<text class="m" x="320" y="268" font-size="13.5" font-weight="700" fill="#FF8090" text-anchor="middle">1 open</text>
<text class="m" x="428" y="268" font-size="13.5" fill="#B7C3D9" text-anchor="middle">2 for later</text>
<text class="m" x="260" y="318" font-size="13" fill="#56D4C5" text-anchor="middle">test → log → rank → fix → re-test</text>
</g>
<rect x=".5" y=".5" width="519" height="339" rx="18" fill="none" stroke="#24335C"/>
</svg>
